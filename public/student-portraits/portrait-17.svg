<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="1" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="480" fill="url(#bgGrad)" />

  <!-- Lighting Vignette -->
  <radialGradient id="vignette" cx="50%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
  </radialGradient>
  <rect width="400" height="480" fill="url(#vignette)" />

  <g filter="url(#shadow)">
    
      <path d="M 80 480 Q 90 370 140 345 L 200 365 L 260 345 Q 310 370 320 480 Z" fill="#60A5FA" />
      <polygon points="150,345 200,375 190,430 170,430 140,350" fill="#60A5FA" filter="brightness(0.9)" />
      <polygon points="250,345 200,375 210,430 230,430 260,350" fill="#60A5FA" filter="brightness(0.9)" />
    
    
    <!-- Neck -->
    <path d="M 165 280 L 165 360 L 235 360 L 235 280 Z" fill="#A2672B" />
    <path d="M 170 280 L 170 360 L 230 360 L 230 280 Z" fill="#C68642" />

    <!-- Head / Face Oval -->
    <path d="M 120 200 Q 120 305 200 310 Q 280 305 280 200 Q 280 130 200 130 Q 120 130 120 200 Z" fill="#C68642" />

    <!-- Ears -->
    <ellipse cx="118" cy="210" rx="9" ry="16" fill="#C68642" />
    <ellipse cx="119" cy="210" rx="5" ry="10" fill="#A2672B" opacity="0.6" />
    <ellipse cx="282" cy="210" rx="9" ry="16" fill="#C68642" />
    <ellipse cx="281" cy="210" rx="5" ry="10" fill="#A2672B" opacity="0.6" />

    <!-- Eyebrows -->
    <path d="M 145 185 Q 165 178 182 184" stroke="#171717" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 218 184 Q 235 178 255 185" stroke="#171717" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Eyes (Expressive, warm) -->
    <ellipse cx="163" cy="204" rx="10" ry="7" fill="#FFFFFF" />
    <circle cx="164" cy="204" r="5" fill="#2E1B0F" />
    <circle cx="166" cy="202" r="1.8" fill="#FFFFFF" />

    <ellipse cx="237" cy="204" rx="10" ry="7" fill="#FFFFFF" />
    <circle cx="236" cy="204" r="5" fill="#2E1B0F" />
    <circle cx="238" cy="202" r="1.8" fill="#FFFFFF" />

    <!-- Upper eyelid lines -->
    <path d="M 152 201 Q 163 196 174 201" stroke="#1F1B18" stroke-width="2" fill="none" />
    <path d="M 226 201 Q 237 196 248 201" stroke="#1F1B18" stroke-width="2" fill="none" />

    <!-- Nose -->
    <path d="M 198 200 L 195 235 Q 200 240 205 235" stroke="#A2672B" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Nostril soft hints -->
    <ellipse cx="192" cy="236" rx="2.5" ry="1.5" fill="#A2672B" opacity="0.6" />
    <ellipse cx="208" cy="236" rx="2.5" ry="1.5" fill="#A2672B" opacity="0.6" />

    <!-- Mouth / Smile -->
    <path d="M 178 262 Q 200 280 222 262" stroke="#991B1B" stroke-width="2" fill="#FFFFFF" />
    <path d="M 178 262 Q 200 274 222 262" fill="#E11D48" opacity="0.7" />
    <path d="M 183 263 Q 200 269 217 263" fill="#FFFFFF" />
  
      <!-- Stubble / Beard outline -->
      <path d="M 150 250 Q 155 295 200 300 Q 245 295 250 250 Q 235 285 200 288 Q 165 285 150 250 Z" fill="#262626" opacity="0.22" />
    
    
      <!-- Curly textured crown -->
      <path d="M 105 180 Q 95 70 200 68 Q 305 70 295 180 Q 275 105 200 110 Q 125 105 105 180 Z" fill="#171717" />
      <circle cx="130" cy="110" r="14" fill="#171717" />
      <circle cx="160" cy="85" r="15" fill="#171717" />
      <circle cx="200" cy="78" r="16" fill="#171717" />
      <circle cx="240" cy="85" r="15" fill="#171717" />
      <circle cx="270" cy="110" r="14" fill="#171717" />
    
    
  </g>
</svg>