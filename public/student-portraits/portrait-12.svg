<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="1" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="480" fill="url(#bgGrad)" />

  <!-- Lighting Vignette -->
  <radialGradient id="vignette" cx="50%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
  </radialGradient>
  <rect width="400" height="480" fill="url(#vignette)" />

  <g filter="url(#shadow)">
    
      <path d="M 80 480 Q 90 370 140 345 L 200 370 L 260 345 Q 310 370 320 480 Z" fill="#DBEAFE" />
      <!-- Kurta neckline & placket -->
      <path d="M 185 365 L 200 390 L 215 365 L 200 450 Z" fill="#2563EB" opacity="0.8" />
      <line x1="200" y1="390" x2="200" y2="450" stroke="#000000" stroke-width="2" opacity="0.3" />
    
    
    <!-- Neck -->
    <path d="M 165 280 L 165 360 L 235 360 L 235 280 Z" fill="#BF874B" />
    <path d="M 170 280 L 170 360 L 230 360 L 230 280 Z" fill="#E2AC6E" />

    <!-- Head / Face Oval -->
    <path d="M 120 200 Q 120 305 200 310 Q 280 305 280 200 Q 280 130 200 130 Q 120 130 120 200 Z" fill="#E2AC6E" />

    <!-- Ears -->
    <ellipse cx="118" cy="210" rx="9" ry="16" fill="#E2AC6E" />
    <ellipse cx="119" cy="210" rx="5" ry="10" fill="#BF874B" opacity="0.6" />
    <ellipse cx="282" cy="210" rx="9" ry="16" fill="#E2AC6E" />
    <ellipse cx="281" cy="210" rx="5" ry="10" fill="#BF874B" opacity="0.6" />

    <!-- Eyebrows -->
    <path d="M 145 185 Q 165 178 182 184" stroke="#1F1C19" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 218 184 Q 235 178 255 185" stroke="#1F1C19" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Eyes (Expressive, warm) -->
    <ellipse cx="163" cy="204" rx="10" ry="7" fill="#FFFFFF" />
    <circle cx="164" cy="204" r="5" fill="#2E1B0F" />
    <circle cx="166" cy="202" r="1.8" fill="#FFFFFF" />

    <ellipse cx="237" cy="204" rx="10" ry="7" fill="#FFFFFF" />
    <circle cx="236" cy="204" r="5" fill="#2E1B0F" />
    <circle cx="238" cy="202" r="1.8" fill="#FFFFFF" />

    <!-- Upper eyelid lines -->
    <path d="M 152 201 Q 163 196 174 201" stroke="#1F1B18" stroke-width="2" fill="none" />
    <path d="M 226 201 Q 237 196 248 201" stroke="#1F1B18" stroke-width="2" fill="none" />

    <!-- Nose -->
    <path d="M 198 200 L 195 235 Q 200 240 205 235" stroke="#BF874B" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Nostril soft hints -->
    <ellipse cx="192" cy="236" rx="2.5" ry="1.5" fill="#BF874B" opacity="0.6" />
    <ellipse cx="208" cy="236" rx="2.5" ry="1.5" fill="#BF874B" opacity="0.6" />

    <!-- Mouth / Smile -->
    <path d="M 178 262 Q 200 280 222 262" stroke="#991B1B" stroke-width="2" fill="#FFFFFF" />
    <path d="M 178 262 Q 200 274 222 262" fill="#E11D48" opacity="0.7" />
    <path d="M 183 263 Q 200 269 217 263" fill="#FFFFFF" />
  
    
      <path d="M 110 180 Q 100 80 200 75 Q 300 80 290 180 Q 270 110 200 115 Q 130 110 110 180 Z" fill="#1F1C19" />
    
    
  </g>
</svg>